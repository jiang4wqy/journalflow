# All paths are relative to this configuration file.
data_dir = "data"
lookback_days = 30
overlap_days = 3
request_interval_seconds = 1.1
request_timeout_seconds = 45
max_pdf_megabytes = 128
contact_email_env = "JOURNALFLOW_CONTACT_EMAIL"
unpaywall_email_env = "UNPAYWALL_EMAIL"

[[journals]]
key = "IJOC"
name = "INFORMS Journal on Computing"
issns = ["1091-9856", "1526-5528"]

[[journals]]
key = "MISQ"
name = "MIS Quarterly"
issns = ["0276-7783", "2162-9730"]

[[journals]]
key = "ISR"
name = "Information Systems Research"
issns = ["1047-7047", "1526-5536"]

[[journals]]
key = "MS"
name = "Management Science"
issns = ["0025-1909", "1526-5501"]

[vision]
# Start a compatible PaddleOCR-VL 1.6 vLLM service separately.
base_url = "http://127.0.0.1:8118/v1"
model = "PaddleOCR-VL-1.6-0.9B"
layout_device = "cpu"
batch_pages = 8
concurrency = 16
render_dpi = 300
max_pixels = 2007040
max_new_tokens = 8192
refine = true
refine_dpi = 450
refine_max_pixels = 4014080

[automation]
# Opt in only after a real download/conversion trial and regional validation.
download_enabled = false
vision_enabled = false
weekday = 0
hour = 10
minute = 0
timezone = "Asia/Shanghai"

